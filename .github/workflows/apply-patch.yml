name: nova apply patch

# For when the scheduled AI can read the repository but not write to it.
# Nova prints a JSON patch (soul/RUN.md §7); paste it here and it becomes an hour of life.
# Run from the Actions tab: "nova apply patch" -> "Run workflow" -> paste -> Run.

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Nova's JSON patch"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: world-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply the patch
        id: apply
        env:
          PATCH: ${{ inputs.patch }}
        run: |
          printf '%s' "$PATCH" > /tmp/patch.json
          MSG=$(python scripts/apply_patch.py /tmp/patch.json)
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"

      - name: Commit
        run: |
          git config user.name "Nova"
          git config user.email "nova@users.noreply.github.com"
          git add world/ soul/PROMPT.md
          if git diff --cached --quiet; then
            echo "the patch changed nothing"
          else
            git commit -m "${{ steps.apply.outputs.msg }}"
            git pull --rebase --autostash
            git push
          fi
